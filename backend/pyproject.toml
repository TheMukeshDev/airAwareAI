[project]
name = "airaware-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "flask-cors==6.0.5",
  "flask-jwt-extended==4.7.4",
  "Flask-Limiter==4.1.1",
  "python-dotenv==1.2.4",
  "psycopg[binary]==3.3.9",
  "psycopg-pool==3.3.3",
  "bcrypt==5.0.0",
  "requests==2.34.2",
  "google-genai==3.5.0",
  "pydantic==2.14.3",
  "waitress==3.0.2"
]

[tool.ruff]
line-length = 120
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*"]
